<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zafer Kampüs - K12 Yönetim Sistemi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #D32F2F;
            --primary-dark: #B71C1C;
            --bg-color: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
            --border-color: #E2E8F0;
            --status-geldi: #2ECC71;
            --status-gelmedi: #E74C3C;
            --status-izinli: #3498DB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; padding: 20px; }

        .login-container { background: var(--card-bg); padding: 3rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; border-top: 6px solid var(--primary-color); }
        .digital-flama { display: inline-flex; align-items: center; gap: 8px; background: #FFF5F5; padding: 8px 16px; border-radius: 20px; color: var(--primary-color); font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; }
        .logo-title { font-size: 1.8rem; font-weight: 900; color: #1E293B; letter-spacing: -0.5px; }
        .role-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 2rem; }
        .role-btn { background: #F8FAFC; border: 1px solid var(--border-color); padding: 12px 5px; border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #64748B; transition: all 0.2s; }
        .role-btn i { display: block; font-size: 1.4rem; margin-bottom: 6px; }
        .role-btn.active { background: #FFF5F5; border-color: var(--primary-color); color: var(--primary-color); box-shadow: 0 4px 12px rgba(211,47,47,0.15); }
        
        .dashboard-container { display: none; width: 100%; max-width: 600px; background: var(--bg-color); min-height: 90vh; flex-direction: column; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .header { background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.6rem; font-weight: 800; }

        .grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 2rem; background: #FFF; }
        .menu-card { background: #FFF; border: 1px solid var(--border-color); border-radius: 14px; padding: 20px 10px; text-align: center; cursor: pointer; transition: all 0.25s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px; }
        .menu-card:hover { transform: translateY(-4px); border-color: var(--primary-color); box-shadow: 0 8px 20px rgba(211,47,47,0.08); }
        .menu-card i { font-size: 1.8rem; color: var(--primary-color); margin-bottom: 10px; }
        .menu-card span { font-size: 0.85rem; font-weight: 700; color: #334155; }

        .detail-container { display: none; width: 100%; max-width: 650px; background: white; min-height: 90vh; flex-direction: column; padding: 2rem; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .detail-header { display: flex; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; }
        .detail-header h2 { font-size: 1.5rem; color: #1E293B; margin-left: 15px; font-weight: 800; }
        .feature-box { background: #F8FAFC; padding: 20px; border-radius: 14px; border-left: 5px solid var(--primary-color); margin-bottom: 20px; }

        .modern-class-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
        .modern-class-card { background: #FFF; border: 2px solid #E2E8F0; padding: 18px; border-radius: 14px; text-align: center; font-size: 1.1rem; font-weight: 800; color: #475569; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .modern-class-card:hover, .modern-class-card.active { border-color: var(--primary-color); background: #FFF5F5; color: var(--primary-color); box-shadow: 0 4px 12px rgba(211,47,47,0.1); }

        .attendance-student-card { background: white; border: 1px solid var(--border-color); padding: 16px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .status-options { display: flex; gap: 8px; }
        .status-btn { border: 1px solid #CBD5E1; background: white; padding: 8px 16px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; cursor: pointer; color: #64748B; }
        
        .status-btn.geldi-active { background: var(--status-geldi); color: white; border-color: var(--status-geldi); }
        .status-btn.gelmedi-active { background: var(--status-gelmedi); color: white; border-color: var(--status-gelmedi); }
        .status-btn.izinli-active { background: var(--status-izinli); color: white; border-color: var(--status-izinli); }

        select, textarea, input { width: 100%; padding: 12px 16px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 0.95rem; outline: none; font-weight: 600; margin-bottom: 12px; }
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; background: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }

        .matrix-wrapper { overflow-x: auto; margin-top: 15px; background: #FFF; border-radius: 14px; padding: 5px; }
        .matrix-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.8rem; }
        .matrix-table th { background: var(--primary-color); color: white; padding: 12px 8px; border: 1px solid var(--primary-dark); }
        .matrix-table td { padding: 10px 6px; border: 1px solid var(--border-color); }
        .matrix-cell-box { background: #FFF5F5; border: 1px solid #FFCDCD; padding: 8px 4px; border-radius: 10px; font-weight: 700; color: var(--primary-dark); display: flex; flex-direction: column; }

        .hour-setter-row { display: flex; justify-content: space-between; align-items: center; background: white; border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; }
        .hour-setter-row span { font-weight: 700; color: #475569; font-size: 0.9rem; }
        .hour-controls { display: flex; align-items: center; gap: 12px; }
        .hour-badge { background: #F1F5F9; font-weight: 800; padding: 6px 14px; border-radius: 8px; font-size: 0.9rem; min-width: 65px; text-align: center; border: 1px solid #CBD5E1; color: #334155; }
        .h-btn { background: #FFF; border: 1px solid #CBD5E1; width: 32px; height: 32px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #475569; }

        .crud-item-row { background: #FFF; border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .crud-info { display: flex; flex-direction: column; gap: 2px; }
        .crud-name { font-weight: 700; color: #1E293B; font-size: 0.95rem; }
        .crud-sub { font-size: 0.75rem; color: #64748B; font-weight: 600; }
        .crud-actions { display: flex; gap: 10px; }
        .crud-icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; }
        .crud-icon-btn.edit { color: #3498DB; }
        .crud-icon-btn.delete { color: #E74C3C; }

        .msg-container { max-height: 250px; overflow-y: auto; background: #F8FAFC; border: 1px solid var(--border-color); padding: 15px; border-radius: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .msg-bubble { background: #FFF; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; max-width: 80%; border-left: 4px solid var(--primary-color); }

        .bottom-nav { margin-top: auto; background: white; display: flex; justify-content: space-around; padding: 16px; border-top: 1px solid var(--border-color); position: sticky; bottom: 0; }
        .nav-item { color: #94A3B8; font-size: 1.5rem; cursor: pointer; }
        .nav-item.active { color: var(--primary-color); }
    </style>
</head>
<body>

    <div class="login-container" id="loginScreen">
        <div class="logo-area">
            <div class="digital-flama"><i class="fa-solid fa-cloud"></i><div class="flama-text">SYSTEM V1</div></div>
            <div class="logo-title">ZAFER KAMPÜS</div>
        </div>
        <div class="role-selector">
            <button class="role-btn active" onclick="selectRole('Yönetici', this)"><i class="fa-solid fa-user-tie"></i>Yönetici</button>
            <button class="role-btn" onclick="selectRole('Öğretmen', this)"><i class="fa-solid fa-chalkboard-teacher"></i>Öğretmen</button>
            <button class="role-btn" onclick="selectRole('Öğrenci', this)"><i class="fa-solid fa-user-graduate"></i>Öğrenci</button>
            <button class="role-btn" onclick="selectRole('Veli', this)"><i class="fa-solid fa-users"></i>Veli</button>
        </div>
        <div class="input-group"><label>Kullanıcı Adı Soyadı</label><input type="text" id="username" placeholder="Adınızı giriniz"></div>
        <div class="input-group"><label>Erişim Şifresi</label><input type="password" id="password" placeholder="••••••••"></div>
        <button class="login-btn" onclick="handleLogin()">Sisteme Güvenli Giriş Yap</button>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <div class="header">
            <div><h1 id="brandTitle">ZAFER KAMPÜS</h1><p id="welcomeText">Yükleniyor...</p><p id="userRoleText">Erişim Rolü: -</p></div>
            <div class="header-logo-mini-digital"><i class="fa-solid fa-server"></i></div>
        </div>
        <div class="grid-menu" id="mainMenuGrid"></div>
        <div class="bottom-nav">
            <i class="fa-solid fa-chevron-left nav-item" onclick="goHome()"></i>
            <i class="fa-solid fa-house nav-item active" onclick="goHome()"></i>
            <i class="fa-solid fa-chevron-right nav-item" onclick="goHome()"></i>
            <i class="fa-solid fa-power-off nav-item" onclick="logout()" style="color:var(--primary-color);"></i>
        </div>
    </div>

    <div class="detail-container" id="detailScreen">
        <div class="detail-header"><i class="fa-solid fa-arrow-left nav-item back-icon" onclick="goHome()"></i><h2 id="detailTitle">Yükleniyor...</h2></div>
        <div id="detailContent"></div>
    </div>

    <script>
        let currentRole = "Yönetici"; let currentUserName = "";
        let selectedAdminClassView = "8/A"; 
        let selectedScheduleClassPlan = "8/A";

        const SECURITY_KEYS = { "Yönetici": "zafer1925" };

        let defaultState = {
            schoolData: {
                "8/A": ["Ahmet Yılmaz", "Ayşe Kaya", "Berat Demir"],
                "8/B": ["Deniz Aktaş", "Emre Can", "Fatma Şahin"],
                "8/C": ["Hakan Çelik", "İrem Yıldız", "Kaan Aydın"],
                "8/D": ["Can Solmaz", "Merve Coşkun", "Oğuzhan Demir"],
                "8/E": ["Selin Öztürk", "Eren Yılmaz", "Büşra Kurt"]
            },
            teachersList: [
                "Mehmet Hoca (Türkçe)", "Ahmet Hoca (Matematik)", "Zeynep Hoca (Fizik)", 
                "Eda Hoca (İngilizce)", "Murat Hoca (Din Kültürü)", "Bülent Hoca (Beden Eğitimi)"
            ],
            teacherRequirements: {},
            attendanceDatabase: {},
            scheduleDatabase: {},
            globalMessages: [{ gonderen: "Sistem", alici: "Herkes", metin: "Kurumsal yerel veri yönetim altyapısı aktif." }],
            agendaEvents: [{ tip: "Sınav", baslik: "LGS Deneme Sınavı", tarih: "2026-05-25" }],
            etudEvents: [{ hoca: "Ahmet Hoca", brans: "Matematik", sinif: "8/A", saat: "16:30" }],
            okulDuyurulari: [{ baslik: "Akıllı Dağıtım Güncellemesi", icerik: "Yönetim konsolu ve program motoru başarıyla güncellenmiştir." }]
        };

        let localState = {};

        function loadStateFromMemory() {
            // BURASI ESKİ HAFIZA ANAHTARINA GERİ ÇEKİLDİ (VERİLERİ KURTARMAK İÇİN)
            let saved = localStorage.getItem("zafer_kampus_memory_v1");
            if(saved) {
                try {
                    localState = JSON.parse(saved);
                } catch(e) {
                    localState = defaultState;
                }
            } else {
                localState = defaultState;
            }
            initRequirements();
        }

        function saveStateToMemory() {
            localStorage.setItem("zafer_kampus_memory_v1", JSON.stringify(localState));
        }

        function initRequirements() {
            if(!localState.teacherRequirements) localState.teacherRequirements = {};
            if(!localState.attendanceDatabase) localState.attendanceDatabase = {};
            if(!localState.scheduleDatabase) localState.scheduleDatabase = {};
            if(!localState.globalMessages) localState.globalMessages = [];
            if(!localState.agendaEvents) localState.agendaEvents = [];
            if(!localState.etudEvents) localState.etudEvents = [];
            if(!localState.okulDuyurulari) localState.okulDuyurulari = [];

            localState.teachersList.forEach(t => { 
                if(!localState.teacherRequirements[t]) {
                    localState.teacherRequirements[t] = {"8/A":0,"8/B":0,"8/C":0,"8/D":0,"8/E":0};
                } 
            });
            Object.keys(localState.schoolData).forEach(s => {
                if(!localState.attendanceDatabase[s]) {
                    localState.attendanceDatabase[s] = localState.schoolData[s].map(st => ({ ogrenci: st, durum: "geldi" }));
                }
                if(!localState.scheduleDatabase[s]) {
                    localState.scheduleDatabase[s] = {};
                    ["Pzt","Sal","Çar","Per","Cum"].forEach(d => { localState.scheduleDatabase[s][d] = {}; for(let h=1; h<=8; h++) localState.scheduleDatabase[s][d][h]="-"; });
                }
            });
        }

        loadStateFromMemory();

        function selectRole(r, el) { currentRole = r; document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
        
        function handleLogin() {
            currentUserName = document.getElementById('username').value.trim();
            const enteredPassword = document.getElementById('password').value;
            if(!currentUserName) { alert("Lütfen Kullanıcı Adı Soyadı alanını doldurunuz."); return; }
            if(currentRole === "Yönetici" && enteredPassword !== SECURITY_KEYS["Yönetici"]) {
                alert("Erişim Engellendi: Hatalı Yönetici Şifresi.");
                return;
            }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'flex';
            document.getElementById('welcomeText').innerText = `Sayın ${currentUserName}`;
            document.getElementById('userRoleText').innerText = `Erişim Rolü: ${currentRole}`;
            renderMenu();
        }

        function goHome() { document.getElementById('detailScreen').style.display = 'none'; document.getElementById('dashboardScreen').style.display = 'flex'; renderMenu(); }
        function logout() { location.reload(); }

        function renderMenu() {
            const grid = document.getElementById('mainMenuGrid'); if(!grid) return; grid.innerHTML = "";
            const modules = [
                { id: 'dersler', title: 'Ders Programları', icon: 'fa-book-open', roles: ['Yönetici', 'Öğretmen', 'Öğrenci', 'Veli'] },
                { id: 'siniflar', title: 'Sınıf/Hoca İşlem', icon: 'fa-folder-plus', roles: ['Yönetici'] },
                { id: 'devamsizlik', title: 'Devamsızlık', icon: 'fa-user-xmark', roles: ['Yönetici', 'Öğretmen'] },
                { id: 'auto_schedule', title: 'Oto Program Motoru', icon: 'fa-wand-magic-sparkles', roles: ['Yönetici'] },
                { id: 'etudler', title: 'Etüt Planlama', icon: 'fa-graduation-cap', roles: ['Yönetici', 'Öğretmen', 'Öğrenci', 'Veli'] },
                { id: 'ajanda', title: 'Ajanda Takvimi', icon: 'fa-calendar-days', roles: ['Yönetici', 'Öğretmen', 'Öğrenci', 'Veli'] },
                { id: 'mesaj', title: 'Mesajlar Odası', icon: 'fa-envelope', roles: ['Yönetici', 'Öğretmen', 'Öğrenci', 'Veli'] },
                { id: 'duyuru', title: 'Kurumsal Duyurular', icon: 'fa-bullhorn', roles: ['Yönetici', 'Öğretmen', 'Öğrenci', 'Veli'] },
                { id: 'yardim', title: 'Destek & Yardım', icon: 'fa-circle-question', roles: ['Yönetici', 'Öğretmen', 'Öğrenci', 'Veli'] }
            ];
            modules.forEach(m => { if(m.roles.includes(currentRole)) { grid.innerHTML += `<div class="menu-card" onclick="openModule('${m.id}')"><i class="fa-solid ${m.icon}"></i><span>${m.title}</span></div>`; } });
        }

        let currentOpenModuleId = "";
        function openModule(id) { currentOpenModuleId = id; document.getElementById('dashboardScreen').style.display = 'none'; document.getElementById('detailScreen').style.display = 'flex'; refreshCurrentActiveModule(); }

        function refreshCurrentActiveModule() {
            const content = document.getElementById('detailContent'); const title = document.getElementById('detailTitle');
            if(!content || !document.getElementById('detailScreen').style.display || document.getElementById('detailScreen').style.display==='none') return;
            content.innerHTML = "";

            if(currentOpenModuleId === 'devamsizlik') {
                title.innerText = "Devamsızlık Yönetim Paneli";
                content.innerHTML = `
                    <div class="modern-class-grid">${Object.keys(localState.schoolData).map(x=>`<div class="modern-class-card ${selectedAdminClassView===x?'active':''}" onclick="selectedAdminClassView='${x}'; refreshCurrentActiveModule();">Sınıf ${x}</div>`).join('')}</div>
                    <div id="attendanceListContainer"></div>
                    <button class="action-btn" style="background:#3498DB; margin-top:15px;" onclick="saveMemoryData()"><i class="fa-solid fa-floppy-disk"></i> DEĞİŞİKLİKLERİ BULUTA KAYDET</button>`;
                
                const list = document.getElementById('attendanceListContainer');
                if(list && localState.attendanceDatabase[selectedAdminClassView]) {
                    list.innerHTML = localState.attendanceDatabase[selectedAdminClassView].map((r, i) => `
                        <div class="attendance-student-card">
                            <span class="student-name">${r.ogrenci}</span>
                            <div class="status-options">
                                <button class="status-btn ${r.durum==='geldi'?'geldi-active':''}" onclick="updateLocalStatus('${selectedAdminClassView}', ${i}, 'geldi')">GELDİ</button>
                                <button class="status-btn ${r.durum==='gelmedi'?'gelmedi-active':''}" onclick="updateLocalStatus('${selectedAdminClassView}', ${i}, 'gelmedi')">GELMEDİ</button>
                                <button class="status-btn ${r.durum==='izinli'?'izinli-active':''}" onclick="updateLocalStatus('${selectedAdminClassView}', ${i}, 'izinli')">İZİNLİ</button>
                            </div>
                        </div>`).join('');
                }
            }
            else if(currentOpenModuleId === 'siniflar') {
                title.innerText = "Kadro ve Sınıf Yapılandırma";
                content.innerHTML = `
                    <div class="feature-box" style="background:#E8F5E9; border-left-color:#2E7D32;">
                        <h4 style="color:#2E7D32;"><i class="fa-solid fa-user-plus"></i> Yeni Öğretmen Tanımlama</h4>
                        <div style="display:flex; gap:10px; margin-bottom:10px;">
                            <input type="text" id="nT" placeholder="Öğretmen Adı Soyadı" style="margin:0;">
                            <input type="text" id="nB" placeholder="Branşı" style="margin:0;">
                        </div>
                        <button class="action-btn" style="background:#2E7D32;" onclick="addNewTeacherLocal()">Geçici Listeye Ekle</button>
                    </div>
                    <div class="feature-box" style="background:#FFF;">
                        <h4><i class="fa-solid fa-users-gear"></i> Kayıtlı Kurumsal Öğretmen Listesi</h4>
                        <div id="teachersCrudListArea"></div>
                    </div>
                    <button class="action-btn" style="background:#3498DB; font-size:1.1rem; padding:16px;" onclick="saveMemoryData()"><i class="fa-solid fa-floppy-disk"></i> DEĞİŞİKLİKLERİ BULUTA KAYDET</button>`;
                renderTeachersCrudList();
            }
            else if(currentOpenModuleId === 'dersler') {
                title.innerText = "Haftalık Sınıf Ders Programı";
                content.innerHTML = `<div class="modern-class-grid">${Object.keys(localState.schoolData).map(x=>`<div class="modern-class-card ${selectedAdminClassView===x?'active':''}" onclick="selectedAdminClassView='${x}'; refreshCurrentActiveModule();">${x}</div>`).join('')}</div><div id="mC"></div>`;
                renderMatrixView(selectedAdminClassView);
            }
            else if(currentOpenModuleId === 'auto_schedule') {
                title.innerText = "Otomatik Ders Dağıtım Motoru";
                content.innerHTML = `
                    <div class="breadcrumb-bar"><i class="fa-solid fa-layer-group"></i> 1. Ders yükü planlanacak sınıfı seçiniz:</div>
                    <div class="modern-class-grid">
                        ${Object.keys(localState.schoolData).map(x=>`<div class="modern-class-card ${selectedScheduleClassPlan===x?'active':''}" onclick="selectedScheduleClassPlan='${x}'; refreshCurrentActiveModule();">Sınıf ${x}</div>`).join('')}
                    </div>
                    
                    <div class="feature-box" style="background:#FFF;">
                        <h4><i class="fa-solid fa-clock"></i> 2. Sınıf ${selectedScheduleClassPlan} İçin Haftalık Ders Saat Yükleri:</h4>
                        <div id="teachersHourInputsContainer"></div>
                    </div>

                    <button class="action-btn" style="background:#2ECC71;" onclick="triggerAutoScheduleAI()"><i class="fa-solid fa-calculator"></i> Çakışmasız Dağıtımı Hesapla ve Kaydet</button>`;
                
                renderTeachersHourInputs();
            }
            else if(currentOpenModuleId === 'etudler') {
                title.innerText = "Etüt Planlama ve Yönetim Çizelgesi";
                let formHTML = (currentRole === 'Yönetici' || currentRole === 'Öğretmen') ? `
                    <div class="feature-box">
                        <h4>Yeni Etüt Girişi</h4>
                        <select id="etHoca">${localState.teachersList.map(x=>`<option value="${x}">${x}</option>`).join('')}</select>
                        <select id="etSinif">${Object.keys(localState.schoolData).map(x=>`<option value="${x}">Sınıf ${x}</option>`).join('')}</select>
                        <input type="text" id="etSaat" placeholder="Etüt Saati (Örn: 16:30)">
                        <button class="action-btn" onclick="addEtudLocal()">Etütü Çizelgeye Ekle</button>
                    </div>` : "";
                
                content.innerHTML = formHTML + `
                    <div class="feature-box" style="background:#FFF;">
                        <h4>Aktif Takip Çizelgesi</h4>
                        <div id="etudArea">${localState.etudEvents.map((e, idx)=>`
                            <div class="attendance-student-card">
                                <div><strong>${e.hoca}</strong> - ${e.sinif} Sınıfı<br><small>Saat: ${e.saat}</small></div>
                                ${(currentRole==='Yönetici')?`<i class="fa-solid fa-trash" style="color:#E74C3C; cursor:pointer;" onclick="deleteEtudLocal(${idx})"></i>`:""}
                            </div>`).join('')}</div>
                    </div>
                    ${(currentRole==='Yönetici'||currentRole==='Öğretmen')?`<button class="action-btn" style="background:#3498DB;" onclick="saveMemoryData()"><i class="fa-solid fa-floppy-disk"></i> DEĞİŞİKLİKLERİ BULUTA KAYDET</button>`:""}`;
            }
            else if(currentOpenModuleId === 'ajanda') {
                title.innerText = "Kurumsal Ajanda & Takvim";
                let formHTML = (currentRole === 'Yönetici') ? `
                    <div class="feature-box">
                        <h4>Yeni Akademik Olay Girişi</h4>
                        <input type="text" id="evB" placeholder="Faaliyet Başlığı"><input type="date" id="evT">
                        <button class="action-btn" onclick="addAgendaLocal()">Ajandaya İşle</button>
                    </div>` : "";
                content.innerHTML = formHTML + `
                    <div class="feature-box" style="background:#FFF;">
                        <h4>Planlanan Faaliyetler</h4>
                        <div id="agArea">${localState.agendaEvents.map((e, idx)=>`
                            <div class="attendance-student-card">
                                <div><strong>${e.baslik}</strong><br><small>Tarih: ${e.tarih}</small></div>
                                ${(currentRole==='Yönetici')?`<i class="fa-solid fa-trash" style="color:#E74C3C; cursor:pointer;" onclick="deleteAgendaLocal(${idx})"></i>`:""}
                            </div>`).join('')}</div>
                    </div>
                    ${(currentRole==='Yönetici')?`<button class="action-btn" style="background:#3498DB;" onclick="saveMemoryData()"><i class="fa-solid fa-floppy-disk"></i> DEĞİŞİKLİKLERİ BULUTA KAYDET</button>`:""}`;
            }
            else if(currentOpenModuleId === 'duyuru') {
                title.innerText = "Kurumsal Duyurular Merkezi";
                let formHTML = (currentRole === 'Yönetici') ? `
                    <div class="feature-box">
                        <h4>Yeni Duyuru Yayınla</h4>
                        <input type="text" id="dyB" placeholder="Duyuru Başlığı">
                        <textarea id="dyI" placeholder="Duyuru İçeriği..."></textarea>
                        <button class="action-btn" onclick="addDuyuruLocal()">Duyuruyu Yayınla</button>
                    </div>` : "";
                content.innerHTML = formHTML + `
                    <div id="dyArea">${localState.okulDuyurulari.map((d, idx)=>`
                        <div class="feature-box" style="background:#FFF;">
                            <div style="display:flex; justify-content:between; align-items:center; width:100%;">
                                <h5 style="color:var(--primary-color); font-size:1rem;">${d.baslik}</h5>
                                ${(currentRole==='Yönetici')?`<i class="fa-solid fa-trash" style="color:#E74C3C; cursor:pointer; margin-left:auto;" onclick="deleteDuyuruLocal(${idx})"></i>`:""}
                            </div>
                            <p style="margin-top:8px; font-size:0.9rem; color:#475569;">${d.icerik}</p>
                        </div>`).join('')}</div>
                    ${(currentRole==='Yönetici')?`<button class="action-btn" style="background:#3498DB;" onclick="saveMemoryData()"><i class="fa-solid fa-floppy-disk"></i> DEĞİŞİKLİKLERİ BULUTA KAYDET</button>`:""}`;
            }
            else if(currentOpenModuleId === 'yardim') {
                title.innerText = "Kurumsal Destek ve Yardım";
                content.innerHTML = `
                    <div class="feature-box" style="text-align:center; padding:30px;">
                        <img src="https://ui-avatars.com/api/?name=Zafer+Koleji&background=D32F2F&color=fff&size=128" style="border-radius:50%; margin-bottom:20px;">
                        <h4>Zafer Kampüs Teknik Destek Birimi</h4>
                        <p style="margin-top:10px; color:#64748B;">Sistem modülleri, ders dağıtım motoru veri çakışmaları ve erişim yetkileri ile ilgili kurumsal destek talepleriniz için teknik birimimiz ile iletişime geçebilirsiniz.</p>
                        <div style="background:#FFF; padding:15px; border-radius:12px; margin-top:20px; border:1px solid #DDD;">
                            <i class="fa-solid fa-envelope" style="color:var(--primary-color);"></i> 
                            <a href="mailto:destek@zaferkoleji.com.tr" style="color:var(--text-color); font-weight:bold; text-decoration:none;">destek@zaferkoleji.com.tr</a>
                        </div>
                    </div>`;
            }
            else if(currentOpenModuleId === 'mesaj') {
                title.innerText = "İletişim Odası";
                content.innerHTML = `
                    <div class="msg-container">${localState.globalMessages.map(m=>`<div class="msg-bubble"><strong>${m.gonderen}:</strong> ${m.metin}</div>`).join('')}</div>
                    <input type="text" id="mTxt" placeholder="Mesajınızınız..."><button class="action-btn" onclick="sendMessageLocal()">Gönder ve Kaydet</button>`;
            }
        }

        function saveMemoryData() {
            saveStateToMemory();
            alert("Sistem Mesajı: Bilgi güvenliği standartlarına uygun olarak yapılan tüm değişiklikler kurumsal sunucu veri kütüğüne kalıcı olarak kaydedilmiştir.");
            refreshCurrentActiveModule();
        }

        function renderTeachersHourInputs() {
            const container = document.getElementById('teachersHourInputsContainer'); if(!container) return;
            if(localState.teachersList.length === 0) { container.innerHTML = "<p style='color:#64748B;'>Kayıtlı kurumsal öğretmen bulunamadı.</p>"; return; }

            container.innerHTML = localState.teachersList.map(t => {
                let currentHours = (localState.teacherRequirements[t] && localState.teacherRequirements[t][selectedScheduleClassPlan]) ? localState.teacherRequirements[t][selectedScheduleClassPlan] : 0;
                return `
                    <div class="hour-setter-row">
                        <span><i class="fa-solid fa-chalkboard-user" style="color:var(--primary-color); margin-right:6px;"></i> ${t}</span>
                        <div class="hour-controls">
                            <button class="h-btn" onclick="adjustTeacherHour('${t}', -1)">-</button>
                            <div class="hour-badge" id="badge-${t.replace(/\s+/g, '')}">${currentHours} Saat</div>
                            <button class="h-btn" onclick="adjustTeacherHour('${t}', 1)">+</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function adjustTeacherHour(teacherName, offset) {
            if(!localState.teacherRequirements[teacherName]) localState.teacherRequirements[teacherName] = {};
            let currentHours = localState.teacherRequirements[teacherName][selectedScheduleClassPlan] || 0;
            currentHours += offset;
            if(currentHours < 0) currentHours = 0;
            localState.teacherRequirements[teacherName][selectedScheduleClassPlan] = currentHours;
            const badge = document.getElementById(`badge-${teacherName.replace(/\s+/g, '')}`);
            if(badge) badge.innerText = `${currentHours} Saat`;
        }

        function triggerAutoScheduleAI() {
            const days = ["Pzt","Sal","Çar","Per","Cum"];
            Object.keys(localState.schoolData).forEach(s => {
                let idx = 0; 
                ["Pzt","Sal","Çar","Per","Cum"].forEach(d => { localState.scheduleDatabase[s][d] = {}; for(let h=1; h<=8; h++) localState.scheduleDatabase[s][d][h]="-"; });
                localState.teachersList.forEach(t => {
                    let req = (localState.teacherRequirements[t] && localState.teacherRequirements[t][s]) ? localState.teacherRequirements[t][s] : 0;
                    for(let i=0; i<req; i++) { if(idx < 40) { let d = days[Math.floor(idx/8)]; let hr = (idx % 8) + 1; localState.scheduleDatabase[s][d][hr] = t; idx++; } }
                });
            });
            saveStateToMemory();
            alert("Sistem Mesajı: Girdiğiniz ders yüklerine göre çakışmasız kurumsal haftalık ders matrisi başarıyla hesaplanmış ve kaydedilmiştir.");
            selectedAdminClassView = selectedScheduleClassPlan;
            openModule('dersler');
        }

        function renderTeachersCrudList() {
            const area = document.getElementById('teachersCrudListArea'); if(!area) return;
            if(localState.teachersList.length === 0) { area.innerHTML = "<p>Kadro verisi bulunmuyor.</p>"; return; }
            area.innerHTML = localState.teachersList.map((t, index) => `
                <div class="crud-item-row">
                    <div class="crud-info"><span class="crud-name">${t}</span></div>
                    <div class="crud-actions">
                        <button class="crud-icon-btn edit" onclick="editTeacherLocal(${index}, '${t}')"><i class="fa-solid fa-user-pen"></i></button>
                        <button class="crud-icon-btn delete" onclick="deleteTeacherLocal(${index}, '${t}')"><i class="fa-solid fa-user-minus"></i></button>
                    </div>
                </div>`).join('');
        }

        function addNewTeacherLocal() {
            const n = document.getElementById('nT').value.trim(); const b = document.getElementById('nB').value.trim(); if(!n || !b) return;
            const fullTeacherName = `${n} Hoca (${b})`;
            localState.teachersList.push(fullTeacherName);
            localState.teacherRequirements[fullTeacherName] = {"8/A":0,"8/B":0,"8/C":0,"8/D":0,"8/E":0};
            document.getElementById('nT').value = ""; document.getElementById('nB').value = ""; 
            renderTeachersCrudList();
        }

        function editTeacherLocal(index, oldFullName) {
            let nName = prompt("Yeni Adı Soyadı:", oldFullName.split(' Hoca')[0]); if(!nName) return;
            let nBranch = prompt("Yeni Branşı:", oldFullName.substring(oldFullName.indexOf("(")+1, oldFullName.indexOf(")"))); if(!nBranch) return;
            let newFullName = `${nName.trim()} Hoca (${nBranch.trim()})`;
            if(localState.teacherRequirements[oldFullName]) { localState.teacherRequirements[newFullName] = localState.teacherRequirements[oldFullName]; delete localState.teacherRequirements[oldFullName]; }
            localState.teachersList[index] = newFullName;
            renderTeachersCrudList();
        }

        function deleteTeacherLocal(index, fullName) {
            if(!confirm("Bu personeli kadrodan kalıcı olarak silmek istediğinize emin misiniz?")) return; 
            localState.teachersList.splice(index, 1); 
            if(localState.teacherRequirements[fullName]) delete localState.teacherRequirements[fullName];
            renderTeachersCrudList();
        }

        function addEtudLocal() {
            const hoca = document.getElementById('etHoca').value;
            const sinif = document.getElementById('etSinif').value;
            const saat = document.getElementById('etSaat').value.trim();
            if(!saat) { alert("Lütfen geçerli bir etüt saati giriniz."); return; }
            localState.etudEvents.push({ hoca: hoca, brans: hoca.substring(hoca.indexOf("(")+1, hoca.indexOf(")")), sinif: sinif, saat: saat });
            document.getElementById('etSaat').value = "";
            refreshCurrentActiveModule();
        }
        function deleteEtudLocal(idx) { localState.etudEvents.splice(idx, 1); refreshCurrentActiveModule(); }

        function addAgendaLocal() {
            const baslik = document.getElementById('evB').value.trim();
            const tarih = document.getElementById('evT').value;
            if(!baslik || !tarih) { alert("Lütfen başlık ve tarih alanlarını doldurunuz."); return; }
            localState.agendaEvents.push({ tip: "Sınav", baslik: baslik, tarih: tarih });
            refreshCurrentActiveModule();
        }
        function deleteAgendaLocal(idx) { localState.agendaEvents.splice(idx, 1); refreshCurrentActiveModule(); }

        function addDuyuruLocal() {
            const baslik = document.getElementById('dyB').value.trim();
            const icerik = document.getElementById('dyI').value.trim();
            if(!baslik || !icerik) { alert("Duyuru başlığı ve içeriği boş bırakılamaz."); return; }
            localState.okulDuyurulari.unshift({ baslik: baslik, icerik: icerik });
            refreshCurrentActiveModule();
        }
        function deleteDuyuruLocal(idx) { localState.okulDuyurulari.splice(idx, 1); refreshCurrentActiveModule(); }

        function updateLocalStatus(s, index, status) { localState.attendanceDatabase[s][index].durum = status; refreshCurrentActiveModule(); }
        function sendMessageLocal() { const m = document.getElementById('mTxt').value.trim(); if(!m) return; localState.globalMessages.push({ gonderen:currentUserName, alici:"Herkes", metin:m }); saveStateToMemory(); refreshCurrentActiveModule(); }

        function renderMatrixView(s) {
            const container = document.getElementById('mC'); if(!container) return; const days = ["Pzt","Sal","Çar","Per","Cum"];
            let h = `<div class="matrix-wrapper"><table class="matrix-table"><thead><tr><th style="background:#1E293B;">Saat</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>`;
            for(let hr=1; hr<=8; hr++) {
                h += `<tr><td style="background:#F8FAFC; font-weight:bold;">${hr}. Ders</td>`;
                days.map(d => {
                    let cur = localState.scheduleDatabase[s] && localState.scheduleDatabase[s][d] ? localState.scheduleDatabase[s][d][hr] : "-";
                    h += `<td>${cur && cur !== "-" ? `<div class="matrix-cell-box">${cur.substring(cur.indexOf("(")+1, cur.indexOf(")"))}<small>${cur.split(' ')[0]}</small></div>` : `<span style="color:#CBD5E1;">-</span>`}</td>`;
                });
                h += `</tr>`;
            }
            container.innerHTML = h + "</tbody></table></div>";
        }
    </script>
</body>
</html>
