<!-- FIREBASE BULUT VERİTABANI VE SİSTEM MOTORU -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCw8wekTKw3Qn-efTBylldgVsRtKgGlW3c",
    authDomain: "zaferai.firebaseapp.com",
    projectId: "zaferai",
    storageBucket: "zaferai.firebasestorage.app",
    messagingSenderId: "808774923591",
    appId: "1:808774923591:web:e8ad9b8b7388ab6eb18862"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const analyticsDocRef = doc(db, "maarif_portal", "analytics");

  const ADMIN_CREDENTIALS = {
    username: "bacharans",
    password: "enesenes1"
  };

  window.isAdminLoggedIn = false;

  // ANALİTİK VE TIKLAMA
  async function recordVisit() {
    try {
      const nowFormatted = new Date().toLocaleString("tr-TR");
      await setDoc(analyticsDocRef, { totalVisits: increment(1), lastVisitAt: nowFormatted }, { merge: true });
    } catch (err) { console.warn("Ziyaret kaydedilemedi:", err); }
  }

  async function recordClick() {
    try {
      await setDoc(analyticsDocRef, { totalClicks: increment(1) }, { merge: true });
    } catch (err) { console.warn("Tıklama kaydedilemedi:", err); }
  }

  document.addEventListener("click", (e) => {
    if (e.target.closest("button") || e.target.closest(".game-card") || e.target.closest("a")) {
      recordClick();
    }
  });

  onSnapshot(analyticsDocRef, (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      document.getElementById('stat-total-visits').innerText = data.totalVisits || 0;
      document.getElementById('stat-total-clicks').innerText = data.totalClicks || 0;
      document.getElementById('stat-last-visit').innerText = data.lastVisitAt || "-";
    }
  });

  // VARSAYILAN ŞABLONLAR
  function generateDefaultGradeData(gradeNum) {
    const data = {};
    for (let i = 1; i <= 36; i++) {
      data[i] = {
        title: `${gradeNum}. Sınıf Din Kültürü - ${i}. Hafta`,
        outcome: `${gradeNum}.${Math.ceil(i/7)}. Öğretim programı kazanımı.`,
        body: `<p>${gradeNum}. Sınıf ${i}. hafta ders içeriği metni.</p>`,
        videoUrl: "https://www.youtube.com/watch?v=84QYx9-H-Yk",
        imageUrl: "",
        gameTerms: [{term: "Kavram", def: "Açıklama"}],
        questions: [{ text: `${gradeNum}. Sınıf ${i}. hafta örnek soru?`, options: ["Doğru Seçenek", "Yanlış Şık", "Yanlış Şık", "Yanlış Şık"], correctIndex: 0 }]
      };
    }
    return data;
  }

  window.curriculumData = {
    5: generateDefaultGradeData(5),
    6: generateDefaultGradeData(6),
    7: generateDefaultGradeData(7),
    8: generateDefaultGradeData(8)
  };

  window.selectedGrade = 8;
  window.activeWeek = 1;
  window.currentEditingQuestions = [];
  window.currentEditingGameTerms = [];
  window.lastQuickQuestionIndex = -1;

  // YÖNETİCİ GİRİŞİ
  window.openLoginModal = function() {
    document.getElementById('login-modal').classList.remove('hidden');
    document.getElementById('login-error-msg').classList.add('hidden');
  };

  window.closeLoginModal = function() {
    document.getElementById('login-modal').classList.add('hidden');
  };

  window.handleAdminLogin = function(e) {
    e.preventDefault();
    const u = document.getElementById('login-username').value.trim();
    const p = document.getElementById('login-password').value.trim();

    if (u === ADMIN_CREDENTIALS.username && p === ADMIN_CREDENTIALS.password) {
      window.isAdminLoggedIn = true;
      window.closeLoginModal();
      window.updateAdminUI();
      alert("Yönetici Girişi Başarılı!");
    } else {
      document.getElementById('login-error-msg').classList.remove('hidden');
    }
  };

  window.logoutAdmin = function() {
    window.isAdminLoggedIn = false;
    window.updateAdminUI();
    window.closeAdminPanel();
    alert("Yönetici oturumu kapatıldı.");
  };

  window.updateAdminUI = function() {
    const btnArea = document.getElementById('admin-auth-btn-area');
    const editBtn = document.getElementById('edit-current-week-btn');

    if (window.isAdminLoggedIn) {
      btnArea.innerHTML = `
        <div class="flex items-center space-x-2">
          <span class="text-xs font-black text-amber-300 bg-indigo-900 px-3 py-1.5 rounded-xl border border-amber-500/30 flex items-center space-x-1">
            <span>👑</span> <span>Yönetici: Enes Başaran</span>
          </span>
          <button onclick="logoutAdmin()" class="bg-rose-800 hover:bg-rose-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition-all shadow">
            Çıkış
          </button>
        </div>
      `;
      if (editBtn) editBtn.classList.remove('hidden');
    } else {
      btnArea.innerHTML = `
        <button onclick="openLoginModal()" class="touch-target bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3.5 py-2 rounded-xl text-xs transition-all flex items-center space-x-1.5 border border-slate-700 shadow">
          <span>🔐</span> <span class="hidden md:inline">Yönetici Girişi</span>
        </button>
      `;
      if (editBtn) editBtn.classList.add('hidden');
    }
  };

  // HER SINIF İÇİN AYRI DOKÜMAN DİNLEME (1MB Limit Çözümü)
  [5, 6, 7, 8].forEach(grade => {
    const gradeDocRef = doc(db, "maarif_portal", `grade_${grade}`);
    onSnapshot(gradeDocRef, (snap) => {
      const statusEl = document.getElementById('cloud-sync-status');
      if (snap.exists() && snap.data().weeks) {
        window.curriculumData[grade] = snap.data().weeks;
        localStorage.setItem(`maarif_backup_g${grade}`, JSON.stringify(snap.data().weeks));
        if (statusEl) statusEl.innerHTML = `<span>🟢</span> <span>Bulut Bağlantısı Aktif</span>`;
      } else {
        window.saveGradeToCloud(grade);
      }
      refreshCurrentView();
    }, (error) => {
      console.error(`Sınıf ${grade} Okuma Hatası:`, error);
      const backup = localStorage.getItem(`maarif_backup_g${grade}`);
      if (backup) window.curriculumData[grade] = JSON.parse(backup);
      refreshCurrentView();
    });
  });

  window.saveGradeToCloud = async function(grade) {
    const statusEl = document.getElementById('cloud-sync-status');
    if (statusEl) statusEl.innerHTML = `<span>⏳</span> <span>Kaydediliyor...</span>`;
    
    try {
      const gradeDocRef = doc(db, "maarif_portal", `grade_${grade}`);
      await setDoc(gradeDocRef, { weeks: window.curriculumData[grade] }, { merge: true });
      localStorage.setItem(`maarif_backup_g${grade}`, JSON.stringify(window.curriculumData[grade]));
      if (statusEl) statusEl.innerHTML = `<span>🟢</span> <span>Buluta Kaydedildi</span>`;
      return true;
    } catch (err) {
      console.error("Bulut Kayıt Hatası:", err);
      if (statusEl) statusEl.innerHTML = `<span>🔴</span> <span>Kayıt Başarısız</span>`;
      alert("Kayıt Hatası: " + err.message);
      return false;
    }
  };

  function refreshCurrentView() {
    const stepWeeks = document.getElementById('step-weeks');
    const stepLesson = document.getElementById('step-lesson');
    if (!stepWeeks.classList.contains('hidden')) {
      window.selectGrade(window.selectedGrade);
    } else if (!stepLesson.classList.contains('hidden')) {
      const data = window.curriculumData[window.selectedGrade]?.[window.activeWeek];
      window.openLesson(window.activeWeek, data);
    }
  }

  // ARAYÜZ VE GEÇİŞLER
  window.setupGradeOptions = function() {
    const gSelect = document.getElementById('form-grade');
    gSelect.innerHTML = '<option value="5">5. Sınıf</option><option value="6">6. Sınıf</option><option value="7">7. Sınıf</option><option value="8">8. Sınıf (LGS)</option>';
    const wSelect = document.getElementById('form-week');
    wSelect.innerHTML = '';
    for (let i = 1; i <= 36; i++) {
      wSelect.innerHTML += `<option value="${i}">${i}. Hafta / Ünite</option>`;
    }
  };

  window.selectGrade = function(grade) {
    window.selectedGrade = grade;
    document.getElementById('step-grade').classList.add('hidden');
    document.getElementById('step-weeks').classList.remove('hidden');
    document.getElementById('selected-grade-title').innerText = `${grade}. Sınıf MEB Müfredat Planı (36 Hafta)`;

    const grid = document.getElementById('weeks-grid');
    grid.innerHTML = '';

    for (let w = 1; w <= 36; w++) {
      const lesson = window.curriculumData[grade]?.[w];
      const isFilled = !!(lesson && lesson.title);
      const qCount = lesson?.questions?.length || 0;

      const card = document.createElement('button');
      card.className = `touch-target p-5 rounded-2xl shadow-sm border transition-all text-left flex flex-col justify-between active:scale-95 ${
        isFilled ? 'bg-white border-slate-200 hover:border-indigo-500 hover:shadow-md' : 'bg-slate-100 border-dashed border-slate-300 opacity-60'
      }`;

      card.onclick = () => { window.openLesson(w, lesson); };

      card.innerHTML = `
        <div class="w-full">
          <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-50 text-indigo-700">${w}. Hafta</span>
          <h4 class="text-sm font-extrabold text-slate-800 mt-2 line-clamp-2">${isFilled ? lesson.title : 'İçerik Girilmemiş'}</h4>
        </div>
        <div class="mt-4 flex items-center justify-between w-full text-[11px] font-bold">
          <span class="text-purple-700 bg-purple-50 px-2 py-0.5 rounded-md">🎯 ${qCount} Soru</span>
          <span class="text-indigo-600">Aç ve İncele →</span>
        </div>
      `;
      grid.appendChild(card);
    }
  };

  window.openLesson = function(week, data) {
    window.activeWeek = week;
    window.lastQuickQuestionIndex = -1;
    document.getElementById('step-weeks').classList.add('hidden');
    document.getElementById('step-lesson').classList.remove('hidden');

    document.getElementById('lesson-badge').innerText = `${window.selectedGrade}. Sınıf / ${week}. Hafta`;
    document.getElementById('lesson-title').innerText = data?.title || "Konu Başlığı Girilmemiş";
    document.getElementById('lesson-outcome').innerText = "MEB Kazanımı: " + (data?.outcome || "Genel müfredat kazanımı.");
    document.getElementById('lesson-body').innerHTML = data?.body || "<p>Bu ders için henüz metin özeti eklenmemiştir.</p>";

    const imgBox = document.getElementById('lesson-image-box');
    const imgTag = document.getElementById('lesson-main-image');
    if (data?.imageUrl) {
      imgTag.src = data.imageUrl;
      imgBox.classList.remove('hidden');
    } else {
      imgBox.classList.add('hidden');
    }

    const videoBox = document.getElementById('video-container');
    if (data?.videoUrl) {
      let vidId = window.getYoutubeId(data.videoUrl);
      if (vidId) {
        videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}" class="w-full h-full border-0" allowfullscreen></iframe>`;
      } else {
        videoBox.innerHTML = `<div class="p-6 text-slate-400 text-center">Video linki geçersiz.</div>`;
      }
    } else {
      videoBox.innerHTML = `<div class="p-6 text-slate-400 text-center flex flex-col items-center"><span class="text-4xl mb-2">🎬</span><span>Bu haftaya henüz video eklenmemiş.</span></div>`;
    }

    const qList = data?.questions || [];
    document.getElementById('quiz-count-badge').innerText = qList.length;
    const qContainer = document.getElementById('questions-list-container');
    qContainer.innerHTML = '';

    if (qList.length === 0) {
      qContainer.innerHTML = `<p class="p-4 text-center text-slate-400 font-bold">Bu haftaya henüz soru eklenmedi.</p>`;
    } else {
      qList.forEach((q, qIdx) => {
        const div = document.createElement('div');
        div.className = "bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-3 shadow-sm";
        div.innerHTML = `
          <div class="font-extrabold text-slate-900 text-base">Soru ${qIdx + 1}: ${q.text}</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${q.options.map((opt, oIdx) => `
              <button onclick="window.solveInLesson(${qIdx}, ${oIdx}, ${q.correctIndex})" id="lesson-btn-${qIdx}-${oIdx}" class="touch-target text-left p-3 bg-white border border-slate-200 rounded-xl font-medium hover:border-indigo-500 transition-all text-sm">
                ${String.fromCharCode(65 + oIdx)}) ${opt}
              </button>
            `).join('')}
          </div>
          <div id="lesson-feedback-${qIdx}" class="hidden p-3 rounded-xl text-center font-bold text-sm"></div>
        `;
        qContainer.appendChild(div);
      });
    }

    window.initGame(data?.gameTerms || []);
    window.switchTab('content');
    window.updateAdminUI();
  };

  window.initGame = function(terms) {
    const container = document.getElementById('game-container');
    const scoreTag = document.getElementById('game-score');
    const msg = document.getElementById('game-success-message');
    
    container.innerHTML = '';
    msg.classList.add('hidden');
    scoreTag.innerText = "Puan: 0";

    if (!terms || terms.length === 0) {
      container.innerHTML = `<div class="col-span-2 text-center p-8 bg-slate-100 rounded-2xl font-bold text-slate-500">Bu hafta için tanımlanmış oyun kavramı bulunamadı.</div>`;
      return;
    }

    let termList = terms.map((item, idx) => ({ id: idx, text: item.term }));
    let defList = terms.map((item, idx) => ({ id: idx, text: item.def }));

    termList.sort(() => Math.random() - 0.5);
    defList.sort(() => Math.random() - 0.5);

    let termCol = document.createElement('div');
    termCol.className = "space-y-3";
    termCol.innerHTML = `<h4 class="font-extrabold text-xs uppercase tracking-wider text-slate-500 mb-2">Kavramlar</h4>`;

    termList.forEach(t => {
      termCol.innerHTML += `
        <div onclick="window.selectTerm(this, ${t.id})" id="term-card-${t.id}" class="game-card p-4 bg-white border-2 border-indigo-100 rounded-2xl font-black text-indigo-950 text-sm md:text-base shadow-sm">
          📌 ${t.text}
        </div>
      `;
    });

    let defCol = document.createElement('div');
    defCol.className = "space-y-3";
    defCol.innerHTML = `<h4 class="font-extrabold text-xs uppercase tracking-wider text-slate-500 mb-2">Açıklamalar / Tanımlar</h4>`;

    defList.forEach(d => {
      defCol.innerHTML += `
        <div onclick="window.selectDef(this, ${d.id})" id="def-card-${d.id}" class="game-card p-4 bg-white border-2 border-slate-200 rounded-2xl font-medium text-slate-700 text-xs md:text-sm shadow-sm">
          💡 ${d.text}
        </div>
      `;
    });

    container.appendChild(termCol);
    container.appendChild(defCol);
  };

  let selectedTermCard = null;
  let selectedDefCard = null;
  let currentGameScore = 0;

  window.selectTerm = function(el, id) {
    if (el.classList.contains('matched')) return;
    document.querySelectorAll('#game-container [id^="term-card-"]').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedTermCard = { el, id };
    window.checkGameMatch();
  };

  window.selectDef = function(el, id) {
    if (el.classList.contains('matched')) return;
    document.querySelectorAll('#game-container [id^="def-card-"]').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedDefCard = { el, id };
    window.checkGameMatch();
  };

  window.checkGameMatch = function() {
    if (selectedTermCard && selectedDefCard) {
      if (selectedTermCard.id === selectedDefCard.id) {
        selectedTermCard.el.className = "game-card matched p-4 border-2 rounded-2xl font-black text-emerald-900 text-sm md:text-base";
        selectedDefCard.el.className = "game-card matched p-4 border-2 rounded-2xl font-medium text-emerald-900 text-xs md:text-sm";
        currentGameScore += 100;
        document.getElementById('game-score').innerText = `Puan: ${currentGameScore}`;
      } else {
        let tEl = selectedTermCard.el;
        let dEl = selectedDefCard.el;
        tEl.classList.add('border-rose-500', 'bg-rose-50');
        dEl.classList.add('border-rose-500', 'bg-rose-50');
        setTimeout(() => {
          tEl.classList.remove('selected', 'border-rose-500', 'bg-rose-50');
          dEl.classList.remove('selected', 'border-rose-500', 'bg-rose-50');
        }, 600);
      }
      selectedTermCard = null;
      selectedDefCard = null;
    }
  };

  window.solveInLesson = function(qIdx, selected, correct) {
    for (let i = 0; i < 4; i++) {
      let b = document.getElementById(`lesson-btn-${qIdx}-${i}`);
      if (b) b.className = "touch-target text-left p-3 bg-white border border-slate-200 text-slate-400 rounded-xl font-medium text-sm";
    }
    let selBtn = document.getElementById(`lesson-btn-${qIdx}-${selected}`);
    let fb = document.getElementById(`lesson-feedback-${qIdx}`);
    fb.classList.remove('hidden');

    if (selected === correct) {
      selBtn.className = "touch-target text-left p-3 bg-emerald-600 border border-emerald-600 text-white rounded-xl font-bold text-sm shadow-md";
      fb.innerText = "🎉 TEBRİKLER! DOĞRU CEVAP.";
      fb.className = "p-3 rounded-xl text-center font-bold text-sm bg-emerald-100 text-emerald-900";
    } else {
      selBtn.className = "touch-target text-left p-3 bg-rose-600 border border-rose-600 text-white rounded-xl font-bold text-sm shadow-md";
      document.getElementById(`lesson-btn-${qIdx}-${correct}`).className = "touch-target text-left p-3 bg-emerald-100 border border-emerald-400 text-emerald-900 rounded-xl font-bold text-sm";
      fb.innerText = "❌ YANLIŞ CEVAP. Tekrar inceleyebilirsin.";
      fb.className = "p-3 rounded-xl text-center font-bold text-sm bg-rose-100 text-rose-900";
    }
  };

  window.triggerQuickQuestionForCurrentWeek = function() {
    const currentLessonData = window.curriculumData[window.selectedGrade]?.[window.activeWeek];
    const qList = currentLessonData?.questions || [];

    if (qList.length === 0) {
      alert(`Bu haftaya (${window.activeWeek}. Hafta) henüz soru eklenmemiş!`);
      return;
    }

    let randomIndex = Math.floor(Math.random() * qList.length);
    if (qList.length > 1 && randomIndex === window.lastQuickQuestionIndex) {
      randomIndex = (randomIndex + 1) % qList.length;
    }
    window.lastQuickQuestionIndex = randomIndex;

    const randomTarget = qList[randomIndex];
    const qZone = document.getElementById('quick-quiz-zone');
    const qBox = document.getElementById('quick-question-box');

    qZone.classList.remove('hidden');
    qZone.scrollIntoView({ behavior: 'smooth' });

    qBox.innerHTML = `
      <div class="bg-indigo-950/60 p-3 rounded-xl border border-white/10 mb-2 flex justify-between text-xs font-bold text-amber-400">
        <span>Konu: ${window.selectedGrade}. Sınıf - ${currentLessonData.title}</span>
        <span>${window.activeWeek}. Hafta Özel Sorusu (Soru ${randomIndex + 1}/${qList.length})</span>
      </div>
      <div class="text-lg md:text-xl font-bold text-white mb-4 bg-slate-900/40 p-4 rounded-xl border border-slate-700">${randomTarget.text}</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        ${randomTarget.options.map((opt, idx) => `
          <button onclick="window.checkQuickAnswer(${idx}, ${randomTarget.correctIndex})" id="quick-opt-${idx}" class="touch-target text-left p-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl font-semibold text-white transition-all text-base active:scale-95">
            ${String.fromCharCode(65 + idx)}) ${opt}
          </button>
        `).join('')}
      </div>
      <div id="quick-feedback" class="hidden text-center text-lg font-black p-4 rounded-2xl shadow-lg mt-3"></div>
    `;
  };

  window.checkQuickAnswer = function(selected, correct) {
    for (let i = 0; i < 4; i++) {
      let b = document.getElementById(`quick-opt-${i}`);
      if (b) b.className = "touch-target text-left p-4 bg-white/5 border border-white/10 text-white/40 rounded-2xl font-semibold text-base";
    }

    const selBtn = document.getElementById(`quick-opt-${selected}`);
    const fb = document.getElementById('quick-feedback');
    fb.classList.remove('hidden');

    if (selected === correct) {
      selBtn.className = "touch-target text-left p-4 bg-emerald-600 border border-emerald-500 text-white font-black text-lg rounded-2xl shadow-xl";
      fb.innerText = "🌟 MUHTEŞEM! DOĞRU CEVAP VERDİN. 100 PUAN! 🌟";
      fb.className = "text-center text-lg font-black p-4 rounded-2xl shadow-lg mt-3 bg-emerald-500 text-slate-950 border-2 border-white animate-bounce";
    } else {
      selBtn.className = "touch-target text-left p-4 bg-rose-600 border border-rose-500 text-white font-bold rounded-2xl";
      let cBtn = document.getElementById(`quick-opt-${correct}`);
      if (cBtn) cBtn.className = "touch-target text-left p-4 bg-emerald-500/30 border-2 border-emerald-400 text-emerald-200 font-black rounded-2xl";
      fb.innerText = "💥 Sağlık Olsun! Doğru Cevap Yeşil Renkle Gösterildi.";
      fb.className = "text-center text-sm font-black p-4 rounded-2xl shadow-lg mt-3 bg-rose-900 text-rose-200 border border-rose-700";
    }
  };

  window.closeQuickQuiz = function() {
    document.getElementById('quick-quiz-zone').classList.add('hidden');
  };

  window.openAdminPanel = function() {
    if (!window.isAdminLoggedIn) {
      window.openLoginModal();
      return;
    }
    document.getElementById('form-grade').value = window.selectedGrade;
    document.getElementById('form-week').value = window.activeWeek;
    window.loadLessonToForm();
    document.getElementById('admin-panel').classList.remove('hidden');
  };

  window.openAdminPanelForCurrentWeek = function() {
    window.openAdminPanel();
  };

  window.closeAdminPanel = function() {
    document.getElementById('admin-panel').classList.add('hidden');
  };

  window.loadLessonToForm = function() {
    const g = document.getElementById('form-grade').value;
    const w = document.getElementById('form-week').value;
    const data = window.curriculumData[g]?.[w] || {};

    document.getElementById('form-title').value = data.title || "";
    document.getElementById('form-outcome').value = data.outcome || "";
    document.getElementById('form-image-url').value = data.imageUrl || "";
    
    if (data.imageUrl) {
      window.showImagePreview(data.imageUrl);
    } else {
      window.clearUploadedImage();
    }

    document.getElementById('form-video-url').value = data.videoUrl || "";
    document.getElementById('form-body-editor').innerHTML = data.body || "";
    
    window.currentEditingQuestions = data.questions ? JSON.parse(JSON.stringify(data.questions)) : [];
    window.currentEditingGameTerms = data.gameTerms ? JSON.parse(JSON.stringify(data.gameTerms)) : [];
    
    window.renderFormQuestions();
    window.renderFormGameTerms();
  };

  window.saveLesson = async function(e) {
    if (e) e.preventDefault();
    if (!window.isAdminLoggedIn) {
      alert("Yetkisiz işlem! Değişiklik yapmak için yönetici girişi yapmalısınız.");
      return;
    }

    const g = document.getElementById('form-grade').value;
    const w = document.getElementById('form-week').value;

    if (!window.curriculumData[g]) window.curriculumData[g] = {};
    
    window.curriculumData[g][w] = {
      title: document.getElementById('form-title').value,
      outcome: document.getElementById('form-outcome').value,
      imageUrl: document.getElementById('form-image-url').value,
      videoUrl: document.getElementById('form-video-url').value,
      body: document.getElementById('form-body-editor').innerHTML,
      questions: window.currentEditingQuestions,
      gameTerms: window.currentEditingGameTerms
    };

    const isSuccess = await window.saveGradeToCloud(g);
    if (isSuccess) {
      alert("Haftalık Ders ve Görseller Başarıyla Buluta Kaydedildi!");
      window.closeAdminPanel();
      window.selectGrade(g);
    }
  };

  window.generateSmartAiQuestion = function() {
    const count = parseInt(document.getElementById('ai-question-count').value) || 1;
    const topicTitle = document.getElementById('form-title').value || "Genel Din Kültürü";

    const generalBank = [
      { text: `"${topicTitle}" konusu düşünüldüğünde, bir müminin sergilemesi gereken en temel ahlaki yaklaşım hangisidir?`, options: ["İhlas ve dürüstlük", "Gösteriş ve kibir", "Sorumluluktan kaçma", "Bencillik"], correctIndex: 0 },
      { text: `Aşağıdakilerden hangisi "${topicTitle}" dersindeki temel öğretilerin toplumsal hayata sağladığı faydalardandır?`, options: ["Karşılıklı sevgi ve adaleti pekiştirmesi", "İnsanlar arası iletişimi koparması", "Sadece bireysel çıkara odaklanması", "Gelenekleri tamamen yok etmesi"], correctIndex: 0 }
    ];

    for (let i = 0; i < count; i++) {
      window.currentEditingQuestions.push(JSON.parse(JSON.stringify(generalBank[i % generalBank.length])));
    }
    window.renderFormQuestions();
  };

  window.addManualQuestionForm = function() {
    window.currentEditingQuestions.push({ text: "Soru metnini yazınız...", options: ["A Şıkkı", "B Şıkkı", "C Şıkkı", "D Şıkkı"], correctIndex: 0 });
    window.renderFormQuestions();
  };

  window.renderFormQuestions = function() {
    const c = document.getElementById('form-questions-editor-list');
    c.innerHTML = '';
    window.currentEditingQuestions.forEach((q, idx) => {
      const d = document.createElement('div');
      d.className = "p-3 bg-slate-50 border rounded-xl space-y-2 text-xs shadow-sm";
      d.innerHTML = `
        <div class="flex justify-between font-bold text-slate-800">
          <span>Soru #${idx+1}</span>
          <button type="button" onclick="window.currentEditingQuestions.splice(${idx},1); window.renderFormQuestions();" class="text-rose-600 hover:underline">Sil</button>
        </div>
        <input type="text" value="${q.text}" onchange="window.currentEditingQuestions[${idx}].text=this.value" class="w-full p-2 border rounded font-semibold bg-white">
        <div class="grid grid-cols-2 gap-2 pt-1">
          ${q.options.map((o, oi) => `
            <div class="flex items-center space-x-1">
              <input type="radio" name="form_c_${idx}" ${q.correctIndex===oi?'checked':''} onchange="window.currentEditingQuestions[${idx}].correctIndex=${oi}">
              <input type="text" value="${o}" onchange="window.currentEditingQuestions[${idx}].options[${oi}]=this.value" class="w-full border p-1 text-[11px] rounded bg-white">
            </div>
          `).join('')}
        </div>
      `;
      c.appendChild(d);
    });
  };

  window.addGameTermForm = function() {
    window.currentEditingGameTerms.push({ term: "Yeni Kavram", def: "Tanımı ve Açıklaması" });
    window.renderFormGameTerms();
  };

  window.renderFormGameTerms = function() {
    const c = document.getElementById('form-game-terms-editor-list');
    c.innerHTML = '';
    if (window.currentEditingGameTerms.length === 0) {
      c.innerHTML = `<p class="text-xs text-slate-400 italic">Henüz oyun kavramı eklenmedi.</p>`;
      return;
    }
    window.currentEditingGameTerms.forEach((item, idx) => {
      const d = document.createElement('div');
      d.className = "flex items-center space-x-2 bg-slate-100 p-2 rounded-lg text-xs";
      d.innerHTML = `
        <input type="text" value="${item.term}" placeholder="Kavram" onchange="window.currentEditingGameTerms[${idx}].term=this.value" class="w-1/3 border p-1 rounded font-bold bg-white">
        <input type="text" value="${item.def}" placeholder="Tanımı" onchange="window.currentEditingGameTerms[${idx}].def=this.value" class="flex-grow border p-1 rounded bg-white">
        <button type="button" onclick="window.currentEditingGameTerms.splice(${idx},1); window.renderFormGameTerms();" class="text-rose-600 font-bold px-1">✕</button>
      `;
      c.appendChild(d);
    });
  };

  // RESİM BOYUTUNU YÜKSEK ORANDA SIKIŞTIRMA (Max 600px & %50 Kalite)
  window.processFile = function(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert("Lütfen geçerli bir resim dosyası seçin.");
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDimension = 600; 

        if (width > height) {
          if (width > maxDimension) {
            height *= maxDimension / width;
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width *= maxDimension / height;
            height = maxDimension;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // JPEG %50 kalite ile dosya boyutunu min seviyeye indir
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
        document.getElementById('form-image-url').value = compressedBase64;
        window.showImagePreview(compressedBase64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  window.handleFileSelect = function(e) {
    const file = e.target.files[0];
    window.processFile(file);
  };

  window.handleDragOver = function(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.add('drag-active');
  };

  window.handleDragLeave = function(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.remove('drag-active');
  };

  window.handleDrop = function(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.remove('drag-active');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      window.processFile(e.dataTransfer.files[0]);
    }
  };

  window.showImagePreview = function(url) {
    if (!url) return;
    document.getElementById('image-preview').src = url;
    document.getElementById('image-preview-container').classList.remove('hidden');
  };

  window.clearUploadedImage = function() {
    document.getElementById('form-image-url').value = "";
    document.getElementById('form-file-input').value = "";
    document.getElementById('image-preview').src = "";
    document.getElementById('image-preview-container').classList.add('hidden');
  };

  window.previewCurrentForm = function() {
    const mockData = {
      title: document.getElementById('form-title').value,
      outcome: document.getElementById('form-outcome').value,
      imageUrl: document.getElementById('form-image-url').value,
      videoUrl: document.getElementById('form-video-url').value,
      body: document.getElementById('form-body-editor').innerHTML,
      questions: window.currentEditingQuestions,
      gameTerms: window.currentEditingGameTerms
    };
    window.closeAdminPanel();
    window.openLesson(document.getElementById('form-week').value, mockData);
  };

  window.switchTab = function(tab) {
    ['content', 'game', 'video', 'quiz'].forEach(t => {
      document.getElementById(`panel-${t}`).classList.add('hidden');
      document.getElementById(`tab-${t}`).className = "touch-target pb-3 font-bold text-slate-400 border-b-4 border-transparent px-3 text-sm md:text-base flex items-center space-x-1";
    });
    document.getElementById(`panel-${tab}`).classList.remove('hidden');
    document.getElementById(`tab-${tab}`).className = "touch-target pb-3 font-black border-b-4 border-indigo-600 text-indigo-600 px-3 text-sm md:text-base flex items-center space-x-1";
  };

  window.getYoutubeId = function(url) {
    if (!url) return null;
    let id = "";
    if (url.includes("v=")) id = url.split("v=")[1].split("&")[0];
    else if (url.includes("youtu.be/")) id = url.split("youtu.be/")[1].split("?")[0];
    return id || null;
  };

  window.goHome = function() {
    document.getElementById('step-weeks').classList.add('hidden');
    document.getElementById('step-lesson').classList.add('hidden');
    document.getElementById('step-grade').classList.remove('hidden');
  };

  window.goBack = function(id) {
    document.getElementById('step-grade').classList.add('hidden');
    document.getElementById('step-weeks').classList.add('hidden');
    document.getElementById('step-lesson').classList.add('hidden');
    document.getElementById(id).classList.remove('hidden');
    if (id === 'step-weeks') window.selectGrade(window.selectedGrade);
  };

  window.onload = function() {
    window.setupGradeOptions();
    window.updateAdminUI();
    recordVisit();
  };
</script>
