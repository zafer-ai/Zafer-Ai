<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zafer Kampüs - K12 Yönetim Sistemi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #D32F2F;
            --primary-dark: #B71C1C;
            --bg-color: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
            --border-color: #E2E8F0;
            --status-geldi: #2ECC71;
            --status-gelmedi: #E74C3C;
            --status-izinli: #3498DB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; padding: 20px; }

        .login-container { background: var(--card-bg); padding: 3rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; border-top: 6px solid var(--primary-color); }
        .digital-flama { display: inline-flex; align-items: center; gap: 8px; background: #FFF5F5; padding: 8px 16px; border-radius: 20px; color: var(--primary-color); font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; }
        .logo-title { font-size: 1.8rem; font-weight: 900; color: #1E293B; letter-spacing: -0.5px; }
        .role-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 2rem; }
        .role-btn { background: #F8FAFC; border: 1px solid var(--border-color); padding: 12px 5px; border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #64748B; transition: all 0.2s; }
        .role-btn i { display: block; font-size: 1.4rem; margin-bottom: 6px; }
        .role-btn.active { background: #FFF5F5; border-color: var(--primary-color); color: var(--primary-color); box-shadow: 0 4px 12px rgba(211,47,47,0.15); }
        
        .dashboard-container { display: none; width: 100%; max-width: 800px; background: var(--bg-color); min-height: 90vh; flex-direction: column; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-bottom: 60px;}
        .header { background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.6rem; font-weight: 800; }

        .grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 2rem; background: #FFF; }
        .menu-card { background: #FFF; border: 1px solid var(--border-color); border-radius: 14px; padding: 20px 10px; text-align: center; cursor: pointer; transition: all 0.25s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px; }
        .menu-card:hover { transform: translateY(-4px); border-color: var(--primary-color); box-shadow: 0 8px 20px rgba(211,47,47,0.08); }
        .menu-card i { font-size: 1.8rem; color: var(--primary-color); margin-bottom: 10px; }
        .menu-card span { font-size: 0.85rem; font-weight: 700; color: #334155; }

        .detail-container { display: none; width: 100%; max-width: 800px; background: white; min-height: 90vh; flex-direction: column; padding: 2rem; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-bottom: 60px;}
        .detail-header { display: flex; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; justify-content: space-between; }
        .detail-header-left { display: flex; align-items: center; }
        .detail-header h2 { font-size: 1.5rem; color: #1E293B; margin-left: 15px; font-weight: 800; }
        
        .feature-box { background: #F8FAFC; padding: 20px; border-radius: 14px; border-left: 5px solid var(--primary-color); margin-bottom: 20px; }

        .modern-class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .modern-class-card { background: #FFF; border: 2px solid #E2E8F0; padding: 15px; border-radius: 14px; text-align: center; font-size: 1.1rem; font-weight: 800; color: #475569; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .modern-class-card:hover, .modern-class-card.active { border-color: var(--primary-color); background: #FFF5F5; color: var(--primary-color); box-shadow: 0 4px 12px rgba(211,47,47,0.1); }

        .attendance-student-card { background: white; border: 1px solid var(--border-color); padding: 16px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.02); flex-wrap: wrap; gap: 10px;}
        .status-options { display: flex; gap: 8px; }
        .status-btn { border: 1px solid #CBD5E1; background: white; padding: 8px 16px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; cursor: pointer; color: #64748B; }
        
        .status-btn.geldi-active { background: var(--status-geldi); color: white; border-color: var(--status-geldi); }
        .status-btn.gelmedi-active { background: var(--status-gelmedi); color: white; border-color: var(--status-gelmedi); }
        .status-btn.izinli-active { background: var(--status-izinli); color: white; border-color: var(--status-izinli); }

        select, textarea, input { width: 100%; padding: 12px 16px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 0.95rem; outline: none; font-weight: 600; margin-bottom: 12px; }
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; background: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; }
        .action-btn.secondary { background: #64748B; }

        .matrix-wrapper { overflow-x: auto; margin-top: 15px; background: #FFF; border-radius: 14px; padding: 5px; }
        .matrix-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.8rem; min-width: 500px; }
        .matrix-table th { background: var(--primary-color); color: white; padding: 12px 8px; border: 1px solid var(--primary-dark); }
        .matrix-table td { padding: 10px 6px; border: 1px solid var(--border-color); }
        .matrix-cell-box { background: #FFF5F5; border: 1px solid #FFCDCD; padding: 8px 4px; border-radius: 10px; font-weight: 700; color: var(--primary-dark); display: flex; flex-direction: column; }

        .hour-setter-row { display: flex; justify-content: space-between; align-items: center; background: white; border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; flex-wrap: wrap; gap: 10px;}
        .hour-setter-row span { font-weight: 700; color: #475569; font-size: 0.9rem; }
        .hour-controls { display: flex; align-items: center; gap: 12px; }
        .hour-badge { background: #F1F5F9; font-weight: 800; padding: 6px 14px; border-radius: 8px; font-size: 0.9rem; min-width: 65px; text-align: center; border: 1px solid #CBD5E1; color: #334155; }
        .h-btn { background: #FFF; border: 1px solid #CBD5E1; width: 32px; height: 32px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #475569; }

        .crud-item-row { background: #FFF; border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .crud-info { display: flex; flex-direction: column; gap: 2px; }
        .crud-name { font-weight: 700; color: #1E293B; font-size: 0.95rem; }
        .crud-sub { font-size: 0.75rem; color: #64748B; font-weight: 600; }
        .crud-actions { display: flex; gap: 10px; }
        .crud-icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; }
        .crud-icon-btn.edit { color: #3498DB; }
        .crud-icon-btn.delete { color: #E74C3C; }
        
        .flex-row { display: flex; gap: 10px; width: 100%; }

        /* CHATBOT CSS */
        .chatbot-widget { position: fixed; bottom: 70px; right: 20px; width: 320px; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 5px 25px rgba(0,0,0,0.2); z-index: 999; display: flex; flex-direction: column; border: 1px solid var(--border-color); transition: all 0.3s; }
        .chatbot-widget.collapsed { transform: translateY(calc(100% - 50px)); }
        .chat-header { background: var(--primary-color); color: white; padding: 15px; border-radius: 16px 16px 0 0; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .chat-body { height: 300px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #F8FAFC; }
        .bot-msg { background: white; padding: 10px; border-radius: 10px 10px 10px 0; border: 1px solid #E2E8F0; align-self: flex-start; max-width: 85%; font-size: 0.85rem;}
        .user-msg { background: var(--primary-color); color: white; padding: 10px; border-radius: 10px 10px 0 10px; align-self: flex-end; max-width: 85%; font-size: 0.85rem;}
        .chat-input-area { display: flex; padding: 10px; background: white; border-top: 1px solid var(--border-color); }
        .chat-input-area input { margin-bottom: 0; border-radius: 20px; padding: 10px 15px; border: 1px solid #E2E8F0; width: 100%; }
        .chat-input-area button { background: var(--primary-color); color: white; border: none; padding: 0 15px; margin-left: 10px; border-radius: 20px; cursor: pointer; }

        .bottom-nav { margin-top: auto; background: white; display: flex; justify-content: space-around; padding: 16px; border-top: 1px solid var(--border-color); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;}
        .nav-item { color: #94A3B8; font-size: 1.5rem; cursor: pointer; }
        .nav-item.active { color: var(--primary-color); }

        @media (max-width: 768px) {
            .role-selector { grid-template-columns: repeat(2, 1fr); }
            .grid-menu { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 1rem; }
            .chatbot-widget { width: 90%; right: 5%; bottom: 60px; }
            .detail-container, .dashboard-container { padding: 1rem; }
            .header { flex-direction: column; text-align: center; gap: 10px; }
            .flex-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginScreen">
        <div class="logo-area">
            <div class="digital-flama"><i class="fa-solid fa-cloud"></i><div class="flama-text">ZAFER KAMPÜS V3.0 (PRO)</div></div>
            <div class="logo-title" style="margin-bottom: 20px;">SİSTEM GİRİŞİ</div>
        </div>
        <div class="role-selector">
            <button class="role-btn active" onclick="selectRole('Yönetici', this)"><i class="fa-solid fa-user-tie"></i>Yönetici</button>
            <button class="role-btn" onclick="selectRole('Öğretmen', this)"><i class="fa-solid fa-chalkboard-teacher"></i>Öğretmen</button>
            <button class="role-btn" onclick="selectRole('Öğrenci', this)"><i class="fa-solid fa-user-graduate"></i>Öğrenci</button>
            <button class="role-btn" onclick="selectRole('Veli', this)"><i class="fa-solid fa-users"></i>Veli</button>
        </div>
        <div class="input-group"><input type="text" id="loginUsername" placeholder="Kullanıcı Adı"></div>
        <div class="input-group"><input type="password" id="loginPassword" placeholder="Şifre"></div>
        <button class="action-btn" onclick="handleLogin()">Güvenli Giriş Yap</button>
        <p style="font-size: 0.8rem; color: #94A3B8; margin-top: 15px;">İlk Kurulum Yönetici Girişi: admin / 1234</p>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <div class="header">
            <div><h1 id="brandTitle">ZAFER KAMPÜS</h1><p id="welcomeText">Yükleniyor...</p><p id="userRoleText">Erişim Rolü: -</p></div>
            <div class="header-logo-mini-digital" id="cloudSyncStatus"><i class="fa-solid fa-cloud-arrow-up"></i> Çevrimdışı (Yerel)</div>
        </div>
        <div class="grid-menu" id="mainMenuGrid"></div>
    </div>

    <div class="detail-container" id="detailScreen">
        <div class="detail-header">
            <div class="detail-header-left">
                <i class="fa-solid fa-arrow-left nav-item back-icon" onclick="goHome()" style="margin-right: 15px; color: var(--text-color);"></i>
                <h2 id="detailTitle">Yükleniyor...</h2>
            </div>
        </div>
        <div id="detailContent"></div>
    </div>

    <!-- CHATBOT -->
    <div class="chatbot-widget collapsed" id="chatbotWidget">
        <div class="chat-header" onclick="toggleChat()">
            <span><i class="fa-solid fa-robot"></i> Zafer Asistan AI</span>
            <i class="fa-solid fa-chevron-up" id="chatToggleIcon"></i>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="bot-msg">Merhaba! Ben Zafer Koleji akıllı asistanıyım. Size nasıl yardımcı olabilirim?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Soru sorun..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
            <button onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="bottom-nav">
        <i class="fa-solid fa-chevron-left nav-item" onclick="goHome()"></i>
        <i class="fa-solid fa-house nav-item active" onclick="goHome()"></i>
        <i class="fa-solid fa-power-off nav-item" onclick="logout()" style="color:var(--primary-color);"></i>
    </div>

    <script>
        let currentRole = "Yönetici"; 
        let currentUserFullName = "";
        let currentUserName = "";
        
        let selectedAdminClassView = "8/A"; 
        let selectedScheduleClassPlan = "8/A";

        // VERİTABANI (STATE) YAPISI
        let defaultState = {
            users: [
                // İlk kurulum için yönetici hesabı
                { id: "u1", role: "Yönetici", fullname: "Sistem Yöneticisi", username: "admin", password: "1234" }
            ],
            schoolData: {
                "8/A": ["Ahmet Yılmaz", "Ayşe Kaya"],
                "8/B": ["Deniz Aktaş", "Emre Can"]
            },
            teachersList: ["Mehmet Hoca (Türkçe)", "Ahmet Hoca (Matematik)"],
            teacherRequirements: {},
            attendanceDatabase: {},
            scheduleDatabase: {},
            chatbotKB: [{soru: "okul saatleri", cevap: "Okulumuzda dersler 09:00'da başlar, 16:30'da biter."}]
        };

        let localState = {};

        // --- PROFESYONEL VERİTABANI EŞİTLEME (SYNC) MİMARİSİ ---
        // Not: Gerçek bir veritabanı bağlandığında bu fonksiyonlar güncellenmelidir.
        function syncWithCloudDatabase() {
            // İLERİDE FIREBASE/SUPABASE BURAYA EKLENECEK.
            // Örnek: fetch('https://api.zaferkoleji.com/sync', { method: 'POST', body: JSON.stringify(localState) })
            localStorage.setItem("zafer_kampus_pro_v3", JSON.stringify(localState));
            console.log("Veriler veritabanına/yerel hafızaya senkronize edildi.");
        }

        function loadStateFromMemory() {
            let saved = localStorage.getItem("zafer_kampus_pro_v3");
            if(saved) {
                try { localState = JSON.parse(saved); } catch(e) { localState = JSON.parse(JSON.stringify(defaultState)); }
            } else {
                localState = JSON.parse(JSON.stringify(defaultState));
            }
            initRequirements();
        }

        function initRequirements() {
            if(!localState.teacherRequirements) localState.teacherRequirements = {};
            if(!localState.attendanceDatabase) localState.attendanceDatabase = {};
            if(!localState.scheduleDatabase) localState.scheduleDatabase = {};
            
            localState.teachersList.forEach(t => { 
                if(!localState.teacherRequirements[t]) {
                    localState.teacherRequirements[t] = {};
                    Object.keys(localState.schoolData).forEach(s => localState.teacherRequirements[t][s] = 0);
                } 
            });
            Object.keys(localState.schoolData).forEach(s => {
                if(!localState.attendanceDatabase[s]) {
                    localState.attendanceDatabase[s] = localState.schoolData[s].map(st => ({ ogrenci: st, durum: "geldi" }));
                }
                if(!localState.scheduleDatabase[s]) {
                    localState.scheduleDatabase[s] = {};
                    ["Pzt","Sal","Çar","Per","Cum"].forEach(d => { localState.scheduleDatabase[s][d] = {}; for(let h=1; h<=8; h++) localState.scheduleDatabase[s][d][h]="-"; });
                }
            });
        }

        loadStateFromMemory();

        // --- GİRİŞ SİSTEMİ (Kimlik Doğrulama) ---
        function selectRole(r, el) { currentRole = r; document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
        
        function handleLogin() {
            const uInput = document.getElementById('loginUsername').value.trim();
            const pInput = document.getElementById('loginPassword').value;
            
            if(!uInput || !pInput) { alert("Lütfen kullanıcı adı ve şifrenizi giriniz."); return; }
            
            // Veritabanında Kullanıcı Ara
            const foundUser = localState.users.find(u => u.username === uInput && u.password === pInput && u.role === currentRole);
            
            if(!foundUser) {
                alert("Hata: Girdiğiniz bilgilere veya role ait bir hesap bulunamadı.");
                return;
            }

            currentUserFullName = foundUser.fullname;
            currentUserName = foundUser.username;
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'flex';
            document.getElementById('welcomeText').innerText = `Hoşgeldiniz, ${currentUserFullName}`;
            document.getElementById('userRoleText').innerText = `Rol: ${currentRole}`;
            
            // Eğer veritabanı varsa bulut ikonu yeşil olsun
            document.getElementById('cloudSyncStatus').innerHTML = `<i class="fa-solid fa-cloud" style="color:#2ECC71;"></i> Sistem Aktif`;
            
            renderMenu();
        }

        function goHome() { 
            document.getElementById('detailScreen').style.display = 'none'; 
            document.getElementById('dashboardScreen').style.display = 'flex'; 
            renderMenu(); 
        }
        
        function logout() { location.reload(); }

        // --- MODÜL MENÜSÜ ---
        function renderMenu() {
            const grid = document.getElementById('mainMenuGrid'); if(!grid) return; grid.innerHTML = "";
            const modules = [
                { id: 'dersler', title: 'Ders Programları', icon: 'fa-book-open', roles: ['Yönetici', 'Öğretmen', 'Öğrenci', 'Veli'] },
                { id: 'ogrenci_yonetim', title: 'Sınıf & Öğrenci Yönetimi', icon: 'fa-users-rectangle', roles: ['Yönetici'] },
                { id: 'kullanici_yonetim', title: 'Hesap & Şifre Yönetimi', icon: 'fa-id-card-clip', roles: ['Yönetici'] },
                { id: 'siniflar', title: 'Öğretmen Kadrosu', icon: 'fa-chalkboard-user', roles: ['Yönetici'] },
                { id: 'devamsizlik', title: 'Devamsızlık', icon: 'fa-user-xmark', roles: ['Yönetici', 'Öğretmen'] },
                { id: 'auto_schedule', title: 'Akıllı Ders Dağıtımı', icon: 'fa-wand-magic-sparkles', roles: ['Yönetici'] },
                { id: 'chatbot_admin', title: 'Chatbot Eğitimi', icon: 'fa-brain', roles: ['Yönetici'] },
                { id: 'veri_transferi', title: 'Veri Tabanı & Senkron', icon: 'fa-database', roles: ['Yönetici'] }
            ];
            modules.forEach(m => { if(m.roles.includes(currentRole)) { grid.innerHTML += `<div class="menu-card" onclick="openModule('${m.id}')"><i class="fa-solid ${m.icon}"></i><span>${m.title}</span></div>`; } });
        }

        let currentOpenModuleId = "";
        function openModule(id) { currentOpenModuleId = id; document.getElementById('dashboardScreen').style.display = 'none'; document.getElementById('detailScreen').style.display = 'flex'; refreshCurrentActiveModule(); }

        function refreshCurrentActiveModule() {
            const content = document.getElementById('detailContent'); const title = document.getElementById('detailTitle');
            if(!content || !document.getElementById('detailScreen').style.display || document.getElementById('detailScreen').style.display==='none') return;
            content.innerHTML = "";

            if(currentOpenModuleId === 'ogrenci_yonetim') {
                title.innerText = "Sınıf ve Öğrenci Yönetimi";
                // Sınıflar listesi
                content.innerHTML = `
                    <div class="feature-box" style="background:#E3F2FD; border-left-color:#1565C0;">
                        <h4 style="color:#1565C0; margin-bottom:10px;"><i class="fa-solid fa-layer-group"></i> Yeni Sınıf Şubesi Aç</h4>
                        <div class="flex-row">
                            <input type="text" id="newClassName" placeholder="Sınıf Adı (Örn: 9/A)">
                            <button class="action-btn" style="background:#1565C0; width:150px;" onclick="createNewClass()">Sınıfı Aç</button>
                        </div>
                    </div>
                    
                    <h4 style="margin-bottom:15px;">Mevcut Sınıflar (Seçiniz)</h4>
                    <div class="modern-class-grid" id="classGridAdmin">
                        ${Object.keys(localState.schoolData).map(x=>`<div class="modern-class-card ${selectedAdminClassView===x?'active':''}" onclick="selectedAdminClassView='${x}'; refreshCurrentActiveModule();">Sınıf ${x}</div>`).join('')}
                    </div>
                    
                    ${Object.keys(localState.schoolData).length > 0 ? `
                    <div class="feature-box" style="background:#FFF;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h4><i class="fa-solid fa-users"></i> ${selectedAdminClassView} Sınıfı Öğrenci Listesi</h4>
                            <button class="action-btn" style="width:auto; margin:0; padding:8px 15px; font-size:0.9rem;" onclick="deleteClass('${selectedAdminClassView}')"><i class="fa-solid fa-trash"></i> Sınıfı Komple Sil</button>
                        </div>
                        <div class="flex-row" style="margin-bottom:15px;">
                            <input type="text" id="newStudentName" placeholder="Yeni Öğrenci Adı Soyadı">
                            <button class="action-btn" style="width:120px;" onclick="addStudentToClass()">Ekle</button>
                        </div>
                        <div id="studentListArea">
                            ${localState.schoolData[selectedAdminClassView].map((stu, idx) => `
                                <div class="crud-item-row">
                                    <div class="crud-info"><span class="crud-name">${stu}</span></div>
                                    <div class="crud-actions">
                                        <button class="crud-icon-btn edit" onclick="editStudent(${idx}, '${stu}')"><i class="fa-solid fa-pen"></i></button>
                                        <button class="crud-icon-btn delete" onclick="deleteStudent(${idx})"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : '<p>Henüz kayıtlı sınıf yok.</p>'}
                `;
            }
            else if(currentOpenModuleId === 'kullanici_yonetim') {
                title.innerText = "Kullanıcı Hesapları ve Şifre Yönetimi";
                content.innerHTML = `
                    <div class="feature-box" style="background:#F3E5F5; border-left-color:#7B1FA2;">
                        <h4 style="color:#7B1FA2; margin-bottom:10px;"><i class="fa-solid fa-user-plus"></i> Sisteme Yeni Kullanıcı Tanımla</h4>
                        <select id="newUserRole">

                                <button class="status-btn ${r.durum==='izinli'?'izinli-active':''}" onclick="updateLocalStatus('${selectedAdminClassView}', ${i}, 'izinli')">İZİNLİ</button>

            else if(currentOpenModuleId === 'auto_schedule') {

                        <strong style="color:#E65100;">Algoritma Kuralı:</strong> Bir sınıfın haftalık ders yükü 40 saattir (Günde 8 saat). Eğer 40 saatten az/fazla atarsanız sistem hata verir. Öğretmen saatleri çakışmayacak şekilde homojen dağıtılır.
                    </div>
                    <div class="modern-class-grid">
                        ${Object.keys(localState.schoolData).map(x=>`<div class="modern-class-card ${selectedScheduleClassPlan===x?'active':''}" onclick="selectedScheduleClassPlan='${x}'; refreshCurrentActiveModule();">Sınıf ${x}</div>`).join('')}

                        <h4>Mevcut Veriyi Kopyala (Dışa Aktar)</h4>

                if(Object.keys(localState.schoolData).length===0) { content.innerHTML="Sınıf yok."; return;}
                content.innerHTML = `<div class="modern-class-grid">${Object.keys(localState.schoolData).map(x=>`<div class="modern-class-card ${selectedAdminClassView===x?'active':''}" onclick="selectedAdminClassView='${x}'; refreshCurrentActiveModule();">${x}</div>`).join('')}</div><div id="mC"></div>`;

                        <input type="text" id="nB" placeholder="Branşı">

                    <div class="feature-box" style="background:#FFF;" id="kbArea">

        // --- SINIF VE ÖĞRENCİ YÖNETİMİ FONKSİYONLARI ---
        function createNewClass() {
            const cName = document.getElementById('newClassName').value.trim();
            if(!cName) return;
            if(localState.schoolData[cName]) { alert("Bu sınıf zaten var!"); return; }
            
            localState.schoolData[cName] = [];
            localState.attendanceDatabase[cName] = [];
            localState.scheduleDatabase[cName] = { "Pzt":{}, "Sal":{}, "Çar":{}, "Per":{}, "Cum":{} };
            for(let h=1; h<=8; h++) { ["Pzt","Sal","Çar","Per","Cum"].forEach(d => localState.scheduleDatabase[cName][d][h] = "-"); }
            
            localState.teachersList.forEach(t => { localState.teacherRequirements[t][cName] = 0; });
            
            selectedAdminClassView = cName;
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }
        function deleteClass(cName) {
            if(!confirm(`${cName} sınıfını ve içindeki tüm öğrencileri/programları kalıcı olarak silmek istediğinize emin misiniz?`)) return;
            delete localState.schoolData[cName];
            delete localState.attendanceDatabase[cName];
            delete localState.scheduleDatabase[cName];
            localState.teachersList.forEach(t => { delete localState.teacherRequirements[t][cName]; });
            
            selectedAdminClassView = Object.keys(localState.schoolData)[0] || "";
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }
        function addStudentToClass() {
            const sName = document.getElementById('newStudentName').value.trim();
            if(!sName) return;
            localState.schoolData[selectedAdminClassView].push(sName);
            localState.attendanceDatabase[selectedAdminClassView].push({ogrenci: sName, durum: "geldi"});
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }
        function deleteStudent(idx) {
            if(!confirm("Öğrenciyi silmek istiyor musunuz?")) return;
            localState.schoolData[selectedAdminClassView].splice(idx, 1);
            localState.attendanceDatabase[selectedAdminClassView].splice(idx, 1);
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }
        function editStudent(idx, oldName) {
            let newName = prompt("Öğrencinin yeni adını girin:", oldName);
            if(newName && newName.trim() !== "") {
                localState.schoolData[selectedAdminClassView][idx] = newName.trim();
                localState.attendanceDatabase[selectedAdminClassView][idx].ogrenci = newName.trim();
                syncWithCloudDatabase(); refreshCurrentActiveModule();
            }
        }

        // --- KULLANICI HESABI YÖNETİMİ ---
        function createUserAccount() {
            const r = document.getElementById('newUserRole').value;
            const f = document.getElementById('newUserFullname').value.trim();
            const u = document.getElementById('newUserUsername').value.trim();
            const p = document.getElementById('newUserPassword').value.trim();
            
            if(!f || !u || !p) { alert("Tüm alanları doldurunuz."); return; }
            if(localState.users.find(x => x.username === u)) { alert("Bu kullanıcı adı sistemde zaten kullanılıyor!"); return; }
            
            localState.users.push({ id: "u"+Date.now(), role: r, fullname: f, username: u, password: p });
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }
        function deleteUserAccount(idx) {
            if(localState.users[idx].username === currentUserName) { alert("Şu an giriş yaptığınız kendi hesabınızı silemezsiniz."); return; }
            if(!confirm("Bu kullanıcının sisteme erişimini tamamen iptal etmek istiyor musunuz?")) return;
            localState.users.splice(idx, 1);
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }

        // --- AUTO SCHEDULE AI MİMARİSİ ---
        function renderTeachersHourInputs() {
            const container = document.getElementById('teachersHourInputsContainer'); if(!container) return;
            let totalClassHours = 0;
            let html = localState.teachersList.map(t => {
                let currentHours = (localState.teacherRequirements[t] && localState.teacherRequirements[t][selectedScheduleClassPlan]) ? localState.teacherRequirements[t][selectedScheduleClassPlan] : 0;
                totalClassHours += currentHours;
                return `
                    <div class="hour-setter-row">
                        <span><i class="fa-solid fa-chalkboard-user" style="color:var(--primary-color); margin-right:6px;"></i> ${t}</span>
                        <div class="hour-controls">
                            <button class="h-btn" onclick="adjustTeacherHour('${t}', -1)">-</button>
                            <div class="hour-badge">${currentHours} Saat</div>
                            <button class="h-btn" onclick="adjustTeacherHour('${t}', 1)">+</button>
                        </div>
                    </div>`;
            }).join('');
            
            html += `<div style="text-align:right; font-weight:bold; color:${totalClassHours > 40 ? '#E74C3C' : (totalClassHours < 40 ? '#F39C12' : '#2ECC71')}; margin-top:15px; padding:10px; background:#F8FAFC; border-radius:8px;">
                Sınıfa Atanan Toplam Saat: ${totalClassHours} / 40
            </div>`;
            container.innerHTML = html;
        }

        function adjustTeacherHour(tName, offset) {
            let currentHours = localState.teacherRequirements[tName][selectedScheduleClassPlan] || 0;
            currentHours += offset;
            if(currentHours < 0) currentHours = 0;
            localState.teacherRequirements[tName][selectedScheduleClassPlan] = currentHours;
            syncWithCloudDatabase(); renderTeachersHourInputs(); 
        }

        function triggerAutoScheduleAI() {
            const days = ["Pzt","Sal","Çar","Per","Cum"];
            let errors = [];
            
            let totalHours = 0;
            localState.teachersList.forEach(t => { totalHours += localState.teacherRequirements[t]?.[selectedScheduleClassPlan] || 0; });
            
            if(totalHours > 40) { alert(`HATA: Sınıf ${selectedScheduleClassPlan} için atanan ders saati (${totalHours}) 40 saati aşıyor! Lütfen saatleri azaltın.`); return; }
            if(totalHours < 40) { alert(`HATA: Sınıf ${selectedScheduleClassPlan} için atanan ders saati (${totalHours}). Tam olarak 40 saat olmalıdır.`); return; }

            // Tüm okul için geçici schedule kopyası al
            let tempSchedule = JSON.parse(JSON.stringify(localState.scheduleDatabase));
            
            // Bu sınıfın içini temizle
            days.forEach(d => { for(let h=1; h<=8; h++) tempSchedule[selectedScheduleClassPlan][d][h] = "-"; });

            let classReqs = [];
            localState.teachersList.forEach(t => {
                let req = localState.teacherRequirements[t]?.[selectedScheduleClassPlan] || 0;
                for(let i=0; i<req; i++) classReqs.push(t);
            });

            // Aynı hocayı aynı güne yığmamak için basit karıştırma ve homojen dağıtım
            let unscheduled = [];
            classReqs.forEach(t => {
                let placed = false;
                
                // Hocanın bu sınıfta EN AZ dersinin olduğu günü bulmaya çalış
                let dayCounts = days.map(d => {
                    let count = 0;
                    for(let h=1;h<=8;h++) if(tempSchedule[selectedScheduleClassPlan][d][h] === t) count++;
                    return {day: d, count: count};
                }).sort((a,b) => a.count - b.count);

                for(let dObj of dayCounts) {
                    let d = dObj.day;
                    if(placed) break;
                    for(let h=1; h<=8; h++) {
                        // 1. Sınıf o saatte boş mu?
                        let isClassFree = tempSchedule[selectedScheduleClassPlan][d][h] === "-";
                        
                        // 2. Öğretmen o saatte BAŞKA BİR SINIFTA ders veriyor mu?
                        let isTeacherBusy = false;
                        Object.keys(tempSchedule).forEach(otherClass => {
                            if(otherClass !== selectedScheduleClassPlan && tempSchedule[otherClass][d][h] === t) {
                                isTeacherBusy = true;
                            }
                        });

                        if(isClassFree && !isTeacherBusy) {
                            tempSchedule[selectedScheduleClassPlan][d][h] = t;
                            placed = true;
                            break;
                        }
                    }
                }
                if(!placed) unscheduled.push(t);
            });

            if(unscheduled.length > 0) {
                alert(`ÇAKIŞMA HATASI: ${unscheduled.join(', ')} öğretmeni başka sınıflarda o saatlerde dolu olduğu için ${selectedScheduleClassPlan} sınıfına atanamadı. Öğretmenin diğer sınıflardaki yükünü kontrol ediniz.`);
                return;
            }

            localState.scheduleDatabase = tempSchedule;
            syncWithCloudDatabase();
            alert("BAŞARILI: Çakışmasız haftalık program başarıyla hesaplandı, günlere homojen bölündü.");
            
            selectedAdminClassView = selectedScheduleClassPlan;
            openModule('dersler');
        }

        // --- DİĞER MODÜL İŞLEMLERİ (Kadros, Yoklama vb.) ---
        function addNewTeacherLocal() {
            const n = document.getElementById('nT').value.trim(); const b = document.getElementById('nB').value.trim(); if(!n || !b) return;
            const fullTeacherName = `${n} Hoca (${b})`;
            if(!localState.teachersList.includes(fullTeacherName)) {
                localState.teachersList.push(fullTeacherName);
                localState.teacherRequirements[fullTeacherName] = {};
                Object.keys(localState.schoolData).forEach(s => localState.teacherRequirements[fullTeacherName][s] = 0);
                syncWithCloudDatabase(); refreshCurrentActiveModule();
            }
        }
        function renderTeachersCrudList() {
            const area = document.getElementById('teachersCrudListArea'); if(!area) return;
            if(localState.teachersList.length === 0) { area.innerHTML = "<p>Kadro verisi bulunmuyor.</p>"; return; }
            area.innerHTML = localState.teachersList.map((t, index) => `
                <div class="crud-item-row">
                    <div class="crud-info"><span class="crud-name">${t}</span></div>
                    <div class="crud-actions"><button class="crud-icon-btn delete" onclick="deleteTeacherLocal(${index}, '${t}')"><i class="fa-solid fa-trash"></i></button></div>
                </div>`).join('');
        }
        function deleteTeacherLocal(index, fullName) {
            if(!confirm("Personeli silmek istiyor musunuz?")) return; 
            localState.teachersList.splice(index, 1); 
            delete localState.teacherRequirements[fullName];
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }

        function updateLocalStatus(s, index, status) { 
            localState.attendanceDatabase[s][index].durum = status; 
            syncWithCloudDatabase(); refreshCurrentActiveModule(); 
        }

        function renderMatrixView(s) {
            const container = document.getElementById('mC'); if(!container) return; const days = ["Pzt","Sal","Çar","Per","Cum"];
            let h = `<div class="matrix-wrapper"><table class="matrix-table"><thead><tr><th style="background:#1E293B;">Saat</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>`;
            for(let hr=1; hr<=8; hr++) {
                h += `<tr><td style="background:#F8FAFC; font-weight:bold;">${hr}. Ders</td>`;
                days.map(d => {
                    let cur = localState.scheduleDatabase[s] && localState.scheduleDatabase[s][d] ? localState.scheduleDatabase[s][d][hr] : "-";
                    h += `<td>${cur && cur !== "-" ? `<div class="matrix-cell-box">${cur.substring(cur.indexOf("(")+1, cur.indexOf(")"))}<small>${cur.split(' ')[0]}</small></div>` : `<span style="color:#CBD5E1;">-</span>`}</td>`;
                });
                h += `</tr>`;
            }
            container.innerHTML = h + "</tbody></table></div>";
        }

        // --- CHATBOT ---
        function toggleChat() {
            const w = document.getElementById('chatbotWidget');
            w.classList.toggle('collapsed');
            document.getElementById('chatToggleIcon').className = w.classList.contains('collapsed') ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
        }
        function sendChatMessage() {
            const inp = document.getElementById('chatInput');
            const msg = inp.value.trim().toLowerCase();
            if(!msg) return;
            const body = document.getElementById('chatBody');
            body.innerHTML += `<div class="user-msg">${inp.value}</div>`;
            inp.value = ""; body.scrollTop = body.scrollHeight;
            setTimeout(() => {
                let answer = "Üzgünüm, bu konu hakkında henüz eğitilmedim. Yöneticinize danışabilirsiniz.";
                for(let kb of localState.chatbotKB) { if(msg.includes(kb.soru.toLowerCase())) { answer = kb.cevap; break; } }
                body.innerHTML += `<div class="bot-msg">${answer}</div>`;
                body.scrollTop = body.scrollHeight;
            }, 500);
        }
        function addKBLocal() {
            const s = document.getElementById('cbSoru').value.trim(); const c = document.getElementById('cbCevap').value.trim();
            if(!s || !c) return;
            localState.chatbotKB.push({soru: s, cevap: c});
            syncWithCloudDatabase(); refreshCurrentActiveModule();
        }
        function deleteKBLocal(idx) { localState.chatbotKB.splice(idx, 1); syncWithCloudDatabase(); refreshCurrentActiveModule(); }

        // --- MANUEL VERİ TRANSFERİ ---
        function copyExport() {
            const ta = document.getElementById('exportData');
            ta.select(); document.execCommand("copy");
            alert("Veri kodu kopyalandı! Telefonunuza gönderip oradaki İçe Aktar bölümüne yapıştırabilirsiniz.");
        }
        function importData() {
            const data = document.getElementById('importData').value;
            try {
                const parsed = JSON.parse(data);
                if(parsed && parsed.schoolData) {
                    localState = parsed;
                    syncWithCloudDatabase();
                    alert("Tebrikler! Veriler başarıyla yüklendi, sistem yenileniyor...");
                    location.reload();
                } else { alert("Hata: Veri formatı uyumsuz."); }
            } catch(e) { alert("Hata: Kodu tam olarak kopyaladığınızdan emin olun."); }
        }

    </script>
